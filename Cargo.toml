[package]
name = "bqwebsite-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.4", features = ["multipart", "http2", "macros"] }
jsonwebtoken = "9.3.1"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [ "cors", "compression-br", "trace" ] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "bstr", "bigdecimal", "rust_decimal", "json" ] }
serde = { version = "1.0.219", features = ["derive"] }
dotenvy = "0.15.7"

[dependencies.uuid]
version = "1.17.0"
# Lets you generate random UUIDs
features = [
    "v4",
    "serde"
]
